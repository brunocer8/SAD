# Deploy do SAD Solar no Render (plano gratuito).
# No Render, selecione o repositório e indique sad_solar/render.yaml como caminho do Blueprint.
services:
  - type: web
    name: sad-solar
    runtime: python
    plan: free
    region: virginia
    rootDir: sad_solar
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      # A chave NÃO fica no arquivo: o Render pede o valor na criação do Blueprint.
      - key: GEMINI_API_KEY
        sync: false
      - key: DEMO_USER
        sync: false
      - key: DEMO_PASSWORD
        sync: false
